                                    <span>{errorMessage}</span>
                                </div>

                                    required
                                    placeholder="Contoh: Budi Prasetyo"
                                    value={studentInfo.name}
                                    onChange={(e) => setStudentInfo({ ...studentInfo, name: e.target.value })}

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Kelas</label>

                                    required
                                    value={studentInfo.studentClass}

                                    <option value="">-- Pilih Kelas --</option>

                                <input

                                    required
                                    placeholder="Masukan token dari pengawas"
                                    value={studentInfo.token}
                                    onChange={(e) => setStudentInfo({ ...studentInfo, token: e.target.value })}
                                    className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none transition font-mono"
                                />
                                <p className="text-[11px] text-slate-500 mt-1 italic">*Petunjuk Token: pkwusmaransa1</p>
                            </div>

                            <div className="bg-blue-50 p-3.5 rounded-lg border border-blue-100 text-xs text-blue-900 space-y-1">
                                <div className="font-semibold flex items-center space-x-1">
                                    <svg className="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <span>Aturan Pengerjaan:</span>
                                </div>
                                <ul className="list-disc list-inside space-y-0.5 text-slate-600 pl-1">
                                    <li>Jumlah Soal: 30 Nomor (Acak)</li>
                                    <li>Waktu Pengerjaan: 60 Menit</li>
                                    <li>Tipe Soal: PG, PG Kompleks, Benar/Salah</li>
                                </ul>
                            </div>

                            <button
                                type="submit"
                                className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow-md transition transform active:scale-[0.99] text-sm flex items-center justify-center space-x-2"
                            >
                                <span>Mulai Kerjakan Soal</span>
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />

        }

        /* STREAMING_CHUNK: Defining ExamView Component */
        function ExamView({ questions, currentQIndex, setCurrentQIndex, userAnswers, setUserAnswers, flagged, setFlagged, handleSubmitExam, studentInfo }) {
            const q = questions[currentQIndex];
            if (!q) return null;

            const isFlagged = !!flagged[q.id];

            const handlePgSelect = (index) => {
                setUserAnswers({ ...userAnswers, [q.id]: index });
            };

            const handleMcmaToggle = (index) => {
                const current = userAnswers[q.id] || [];
                let updated;
                if (current.includes(index)) {
                    updated = current.filter(i => i !== index);
                } else {
                    updated = [...current, index];
                }
                setUserAnswers({ ...userAnswers, [q.id]: updated });
            };

            const handleKategoriSelect = (stIndex, val) => {
                const current = userAnswers[q.id] || {};
                const updated = { ...current, [stIndex]: val };
                setUserAnswers({ ...userAnswers, [q.id]: updated });
            };

            const toggleFlag = () => {
                setFlagged({ ...flagged, [q.id]: !isFlagged });
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <div className="lg:col-span-3 space-y-4">
                        <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                            <div className="bg-slate-50 px-6 py-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center space-x-2">
                                    <span className="bg-blue-700 text-white font-bold px-3 py-1 rounded-md text-sm">
                                        Soal No. {currentQIndex + 1} / {questions.length}
                                    </span>
                                    <span className="bg-slate-200 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-md uppercase">
                                        {q.type === 'pg' && 'Pilihan Ganda'}
                                        {q.type === 'mcma' && 'PG Kompleks (Jawaban > 1)'}
                                        {q.type === 'kategori' && 'Benar / Salah'}
                                    </span>
                                </div>
                                <button
                                    onClick={toggleFlag}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition ${isFlagged ? 'bg-amber-500 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    <svg className="w-4 h-4" fill={isFlagged ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" />
                                    </svg>
                                    <span>Ragu-Ragu</span>
                                </button>
                            </div>

                            <div className="p-6 space-y-4">
                                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                    {q.elemen} • {q.subelemen}
                                </div>

                                {q.stem && (
                                    <div className="bg-slate-50 border-l-4 border-blue-600 p-4 rounded-r-lg text-sm text-slate-800 leading-relaxed font-medium">
                                        {q.stem}
                                    </div>
                                )}

                                <div className="text-base font-semibold text-slate-900 leading-snug">
                                    {q.question}
                                </div>

                                <div className="pt-2">
                                    {q.type === "pg" && (
                                        <div className="space-y-2.5">
                                            {q.options.map((opt, idx) => {
                                                const selected = userAnswers[q.id] === idx;
                                                const label = String.fromCharCode(65 + idx);
                                                return (
                                                    <div
                                                        key={idx}
                                                        onClick={() => handlePgSelect(idx)}
                                                        className={`p-3.5 rounded-xl border-2 transition cursor-pointer flex items-start space-x-3 ${selected ? 'border-blue-600 bg-blue-50/60 shadow-sm' : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'}`}
                                                    >
                                                        <span className={`w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center flex-shrink-0 transition ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                                            {label}
                                                        </span>
                                                        <span className="text-sm text-slate-800 font-medium pt-0.5 leading-snug">
                                                            {opt}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {q.type === "mcma" && (
                                        <div className="space-y-2.5">
                                            {q.options.map((opt, idx) => {
                                                const currentArr = userAnswers[q.id] || [];
                                                const isChecked = currentArr.includes(idx);
                                                return (
                                                    <div
                                                        key={idx}
                                                        onClick={() => handleMcmaToggle(idx)}
                                                        className={`p-3.5 rounded-xl border-2 transition cursor-pointer flex items-start space-x-3 ${isChecked ? 'border-indigo-600 bg-indigo-50/60 shadow-sm' : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'}`}
                                                    >
                                                        <div className={`w-5 h-5 rounded border flex items-center justify-center mt-0.5 transition ${isChecked ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-400 bg-white'}`}>
                                                            {isChecked && (
                                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
                                                                </svg>
                                                            )}
                                                        </div>
                                                        <span className="text-sm text-slate-800 font-medium leading-snug">
                                                            {opt}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {q.type === "kategori" && (
                                        <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-slate-100 text-slate-700 text-xs uppercase font-bold">
                                                    <tr>
                                                        <th className="p-3.5">Pernyataan Evaluasi</th>
                                                        <th className="p-3.5 w-24 text-center">Benar</th>
                                                        <th className="p-3.5 w-24 text-center">Salah</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-200">
                                                    {q.statements.map((st, idx) => {
                                                        const userVal = (userAnswers[q.id] || {})[idx];
                                                        return (
                                                            <tr key={idx} className="hover:bg-slate-50">
                                                                <td className="p-3.5 font-medium text-slate-800 leading-snug">
                                                                    {st.text}
                                                                </td>
                                                                <td className="p-3.5 text-center">
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => handleKategoriSelect(idx, "Benar")}
                                                                        className={`w-16 py-1.5 text-xs font-bold rounded-lg border transition ${userVal === "Benar" ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-100'}`}
                                                                    >
                                                                        Benar
                                                                    </button>
                                                                </td>
                                                                <td className="p-3.5 text-center">
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => handleKategoriSelect(idx, "Salah")}
                                                                        className={`w-16 py-1.5 text-xs font-bold rounded-lg border transition ${userVal === "Salah" ? 'bg-rose-600 text-white border-rose-600 shadow' : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-100'}`}
                                                                    >
                                                                        Salah
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="bg-slate-50 px-6 py-4 border-t border-slate-200 flex items-center justify-between">
                                <button
                                    disabled={currentQIndex === 0}
                                    onClick={() => setCurrentQIndex(prev => prev - 1)}
                                    className="px-4 py-2 border border-slate-300 text-slate-700 bg-white font-semibold text-xs md:text-sm rounded-lg hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center space-x-1"
                                >
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
                                    </svg>
                                    <span>Sebelumnya</span>
                                </button>

                                {currentQIndex < questions.length - 1 ? (
                                    <button
                                        onClick={() => setCurrentQIndex(prev => prev + 1)}
                                        className="px-5 py-2 bg-blue-700 hover:bg-blue-800 text-white font-semibold text-xs md:text-sm rounded-lg shadow transition flex items-center space-x-1"
                                    >
                                        <span>Selanjutnya</span>
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                                        </svg>
                                    </button>
                                ) : (
                                    <button
                                        onClick={handleSubmitExam}
                                        className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs md:text-sm rounded-lg shadow-md transition"
                                    >
                                        Kumpulkan Ujian
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="space-y-4">
                        <div className="bg-white p-4 rounded-xl shadow-md border border-slate-200">
                            <div className="text-xs text-slate-400 font-semibold uppercase">Peserta Ujian</div>
                            <div className="text-base font-bold text-slate-800 truncate">{studentInfo.name}</div>
                            <div className="text-xs text-blue-700 font-medium mt-0.5">Kelas: {studentInfo.studentClass}</div>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-md border border-slate-200">
                            <h3 className="text-xs font-bold text-slate-700 uppercase mb-3 flex items-center justify-between">
                                <span>Peta Nomor Soal</span>
                                <span className="text-[10px] text-slate-400 font-normal">30 Nomor</span>
                            </h3>

                            <div className="grid grid-cols-5 gap-2 max-h-80 overflow-y-auto p-1">
                                {questions.map((qItem, idx) => {
                                    const uAns = userAnswers[qItem.id];
                                    let isAnswered = false;
                                    if (qItem.type === "pg") {
                                        isAnswered = uAns !== undefined;
                                    } else if (qItem.type === "mcma") {
                                        isAnswered = Array.isArray(uAns) && uAns.length > 0;
                                    } else if (qItem.type === "kategori") {
                                        isAnswered = uAns && Object.keys(uAns).length === qItem.statements.length;
                                    }

                                    const isFlag = !!flagged[qItem.id];
                                    const isCurrent = currentQIndex === idx;

                                    let bgClass = "bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200";
                                    if (isFlag) {
                                        bgClass = "bg-amber-500 text-white border-amber-500 font-bold shadow-sm";
                                    } else if (isAnswered) {
                                        bgClass = "bg-blue-700 text-white border-blue-700 font-bold";
                                    }

                                    return (
                                        <button
                                            key={qItem.id}
                                            onClick={() => setCurrentQIndex(idx)}
                                            className={`h-9 w-full rounded-lg text-xs font-bold border transition flex items-center justify-center relative ${bgClass} ${isCurrent ? 'ring-2 ring-offset-2 ring-blue-600 scale-105' : ''}`}
                                        >
                                            {idx + 1}
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="mt-4 pt-3 border-t border-slate-100 space-y-1.5 text-[11px] text-slate-600">
                                <div className="flex items-center space-x-2">
                                    <div className="w-3 h-3 bg-blue-700 rounded"></div>
                                    <span>Sudah Dijawab</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <div className="w-3 h-3 bg-amber-500 rounded"></div>
                                    <span>Ragu-Ragu</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <div className="w-3 h-3 bg-slate-100 border border-slate-300 rounded"></div>
                                    <span>Belum Dijawab</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* STREAMING_CHUNK: Defining ResultView Component */
        function ResultView({ studentInfo, lastScoreResult, questions, userAnswers, onRestart }) {
            const [showReview, setShowReview] = useState(false);

            if (!lastScoreResult) return null;

            const { score, correctCount, totalCount } = lastScoreResult;

            return (
                <div className="max-w-3xl mx-auto space-y-6 my-4">
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden text-center">
                        <div className="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 p-8 text-white relative">
                            <span className="bg-yellow-400 text-slate-900 font-bold text-xs uppercase px-3 py-1 rounded-full tracking-wider">
                                Hasil Try Out Selesai
                            </span>
                            <h2 className="text-2xl font-bold mt-2">{studentInfo.name}</h2>
                            <p className="text-sm text-blue-200 font-medium">Kelas: {studentInfo.studentClass} • SMAN 1 Randublatung</p>

                            <div className="mt-6 inline-flex flex-col items-center justify-center bg-white/10 border border-white/20 rounded-2xl p-6 backdrop-blur-md min-w-[200px]">
                                <span className="text-xs uppercase text-blue-200 font-semibold tracking-widest">Skor Akhir</span>
                                <span className="text-6xl font-black text-yellow-300 my-1">{score}</span>
                                <span className="text-xs text-blue-100 font-medium">Skala 0 - 100</span>
                            </div>
                        </div>

                        <div className="p-6 bg-slate-50 border-b border-slate-200 grid grid-cols-2 md:grid-cols-3 gap-4 text-center">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                <div className="text-xs text-slate-500 font-semibold uppercase">Jawaban Benar</div>
                                <div className="text-2xl font-extrabold text-emerald-600 mt-0.5">{correctCount} <span className="text-xs text-slate-400 font-normal">/ {totalCount}</span></div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                <div className="text-xs text-slate-500 font-semibold uppercase">Jawaban Salah</div>
                                <div className="text-2xl font-extrabold text-rose-600 mt-0.5">{totalCount - correctCount} <span className="text-xs text-slate-400 font-normal">/ {totalCount}</span></div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm col-span-2 md:col-span-1">
                                <div className="text-xs text-slate-500 font-semibold uppercase">Akurasi</div>
                                <div className="text-2xl font-extrabold text-blue-600 mt-0.5">{Math.round((correctCount / totalCount) * 100)}%</div>
                            </div>
                        </div>

                        <div className="p-6 flex flex-wrap justify-center gap-3">
                            <button
                                onClick={() => setShowReview(!showReview)}
                                className="bg-slate-800 hover:bg-slate-900 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow transition flex items-center space-x-2"
                            >
                                <svg className="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <span>{showReview ? 'Sembunyikan Pembahasan' : 'Lihat Pembahasan Soal'}</span>
                            </button>

                            <button
                                onClick={onRestart}
                                className="bg-blue-700 hover:bg-blue-800 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow transition flex items-center space-x-1"
                            >
                                <span>Kembali ke Halaman Depan</span>
                            </button>
                        </div>
                    </div>

                    {showReview && (
                        <div className="space-y-4">
                            <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                <svg className="w-5 h-5 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span>Review & Pembahasan Kunci Jawaban</span>
                            </h3>

                            {questions.map((q, idx) => {
                                const uAns = userAnswers[q.id];
                                let isCorrect = false;

                                if (q.type === "pg") {
                                    isCorrect = uAns === q.answer;
                                } else if (q.type === "mcma") {
                                    if (Array.isArray(uAns)) {
                                        isCorrect = [...uAns].sort().join(",") === [...q.answer].sort().join(",");
                                    }
                                } else if (q.type === "kategori") {
                                    if (uAns) {
                                        isCorrect = q.statements.every((st, sIdx) => uAns[sIdx] === st.answer);
                                    }
                                }

                                return (
                                    <div key={q.id} className={`p-5 rounded-xl border bg-white shadow-sm space-y-3 ${isCorrect ? 'border-emerald-300' : 'border-rose-300'}`}>
                                        <div className="flex items-center justify-between">
                                            <span className="font-bold text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded">
                                                No. {idx + 1} ({q.code})
                                            </span>
                                            <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                {isCorrect ? '✓ Jawaban Tepat' : '✗ Jawaban Belum Tepat'}
                                            </span>
                                        </div>

                                        <p className="text-sm font-semibold text-slate-800">{q.question}</p>

                                        {q.type === "pg" && (
                                            <div className="text-xs space-y-1 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                                <div><span className="font-semibold text-slate-600">Jawaban Anda:</span> <span className={isCorrect ? 'text-emerald-700 font-bold' : 'text-rose-700 font-bold'}>{uAns !== undefined ? `${String.fromCharCode(65 + uAns)}. ${q.options[uAns]}` : '(Tidak dijawab)'}</span></div>
                                                <div><span className="font-semibold text-slate-600">Kunci Jawaban:</span> <span className="text-emerald-700 font-bold">{String.fromCharCode(65 + q.answer)}. {q.options[q.answer]}</span></div>
                                            </div>
                                        )}

                                        {q.type === "mcma" && (
                                            <div className="text-xs space-y-1 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                                <div><span className="font-semibold text-slate-600">Jawaban Anda:</span> <span className="font-bold">{Array.isArray(uAns) && uAns.length > 0 ? uAns.map(i => q.options[i]).join("; ") : '(Tidak dijawab)'}</span></div>
                                                <div><span className="font-semibold text-slate-600">Kunci Jawaban:</span> <span className="text-emerald-700 font-bold">{q.answer.map(i => q.options[i]).join("; ")}</span></div>
                                            </div>
                                        )}

                                        {q.type === "kategori" && (
                                            <div className="text-xs space-y-1 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                                <table className="w-full text-left">
                                                    <thead>
                                                        <tr className="border-b text-slate-500 font-bold">
                                                            <th className="pb-1">Pernyataan</th>
                                                            <th className="pb-1 w-20">Anda</th>
                                                            <th className="pb-1 w-20">Kunci</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-200">
                                                        {q.statements.map((st, sIdx) => {
                                                            const uVal = (uAns || {})[sIdx] || '-';
                                                            return (
                                                                <tr key={sIdx}>
                                                                    <td className="py-1 font-medium text-slate-700">{st.text}</td>
                                                                    <td className={`py-1 font-bold ${uVal === st.answer ? 'text-emerald-600' : 'text-rose-600'}`}>{uVal}</td>
                                                                    <td className="py-1 font-bold text-emerald-700">{st.answer}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        /* STREAMING_CHUNK: Defining TeacherAuthView Component (Password hint removed) */
        function TeacherAuthView({ onSuccess, onCancel }) {
            const [pass, setPass] = useState("");
            const [err, setErr] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (pass === TEACHER_PASSWORD) {
                    onSuccess();
                } else {
                    setErr("Kata sandi guru salah!");
                }
            };

            return (
                <div className="max-w-md mx-auto my-12">
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 space-y-4">
                        <div className="text-center">
                            <div className="inline-block bg-blue-100 p-3 rounded-full mb-2">
                                <svg className="w-8 h-8 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                            <h2 className="text-lg font-bold text-slate-800">Akses Portal Guru / Admin</h2>
                            <p className="text-xs text-slate-500">Masukan kata sandi khusus untuk melihat rekap nilai siswa</p>
                        </div>

                        {err && (
                            <div className="bg-red-50 text-red-700 p-3 rounded text-xs text-center font-medium border border-red-200">
                                {err}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 uppercase mb-1">Kata Sandi Guru</label>
                                <input
                                    type="password"
                                    required
                                    placeholder="Masukan kata sandi guru"
                                    value={pass}
                                    onChange={(e) => setPass(e.target.value)}
                                    className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 outline-none"
                                />
                            </div>

                            <div className="flex space-x-2">
                                <button
                                    type="button"
                                    onClick={onCancel}
                                    className="w-1/2 py-2.5 border border-slate-300 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 transition"
                                >
                                    Batal
                                </button>
                                <button
                                    type="submit"
                                    className="w-1/2 py-2.5 bg-blue-700 hover:bg-blue-800 text-white rounded-lg text-sm font-bold shadow transition"
                                >
                                    Masuk Database
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        /* STREAMING_CHUNK: Defining TeacherDbView Component */
        function TeacherDbView({ dbRecords, setDbRecords, onBackToHome }) {
            const [selectedClass, setSelectedClass] = useState("ALL");
            const [sortBy, setSortBy] = useState("NAME_ASC");
            const [searchQuery, setSearchQuery] = useState("");

            const filteredRecords = useMemo(() => {
                let records = [...dbRecords];

                if (selectedClass !== "ALL") {
                    records = records.filter(r => r.studentClass === selectedClass);
                }

                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    records = records.filter(r => r.name.toLowerCase().includes(q));
                }

                records.sort((a, b) => {
                    if (sortBy === "NAME_ASC") return a.name.localeCompare(b.name);
                    if (sortBy === "NAME_DESC") return b.name.localeCompare(a.name);
                    if (sortBy === "SCORE_HIGH") return b.score - a.score;
                    if (sortBy === "SCORE_LOW") return a.score - b.score;
                    if (sortBy === "DATE_DESC") return b.id - a.id;
                    return 0;
                });

                return records;
            }, [dbRecords, selectedClass, sortBy, searchQuery]);

            const schoolAvg = useMemo(() => {
                if (dbRecords.length === 0) return 0;
                const total = dbRecords.reduce((acc, r) => acc + r.score, 0);
                return Math.round(total / dbRecords.length);
            }, [dbRecords]);

            const highestScore = useMemo(() => {
                if (dbRecords.length === 0) return 0;
                return Math.max(...dbRecords.map(r => r.score));
            }, [dbRecords]);

            const lowestScore = useMemo(() => {
                if (dbRecords.length === 0) return 0;
                return Math.min(...dbRecords.map(r => r.score));
            }, [dbRecords]);

            const handleDeleteRecord = (id) => {
                if (window.confirm("Hapus data nilai siswa ini?")) {
                    setDbRecords(prev => prev.filter(r => r.id !== id));
                }
            };

            const handleClearDb = () => {
                if (window.confirm("Apakah Anda yakin ingin MENGHAPUS SELURUH database nilai?")) {
                    setDbRecords([]);
                }
            };

            const handleExportCsv = () => {
                if (dbRecords.length === 0) {
                    alert("Belum ada data untuk diekspor!");
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "No,Nama Siswa,Kelas,Skor Akhir,Jawaban Benar,Total Soal,Waktu Selesai\n";

                filteredRecords.forEach((r, idx) => {
                    const cleanName = `"${r.name.replace(/"/g, '""')}"`;
                    csvContent += `${idx + 1},${cleanName},${r.studentClass},${r.score},${r.correctCount || '-'},${r.totalCount || 30},"${r.date}"\n`;
                });

                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `REKAP_NILAI_TRYOUT_PKWU_2026_${selectedClass}_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800">Database & Rekap Nilai Try Out TKA 2026</h2>
                            <p className="text-xs text-slate-500 mt-0.5">SMAN 1 Randublatung • Produk dan Kewirausahaan</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <button
                                onClick={handleExportCsv}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs md:text-sm px-4 py-2 rounded-lg shadow transition flex items-center space-x-1.5"
                            >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span>Ekspor Ke Excel / CSV</span>
                            </button>

                            <button
                                onClick={onBackToHome}
                                className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-xs md:text-sm px-4 py-2 rounded-lg transition"
                            >
                                Keluar Admin
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div className="text-xs font-semibold text-slate-400 uppercase">Total Peserta</div>
                            <div className="text-2xl font-extrabold text-blue-700 mt-1">{dbRecords.length} <span className="text-xs text-slate-400 font-normal">Siswa</span></div>
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div className="text-xs font-semibold text-slate-400 uppercase">Rata-Rata Sekolah</div>
                            <div className="text-2xl font-extrabold text-indigo-700 mt-1">{schoolAvg} <span className="text-xs text-slate-400 font-normal">/ 100</span></div>
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div className="text-xs font-semibold text-slate-400 uppercase">Nilai Tertinggi</div>
                            <div className="text-2xl font-extrabold text-emerald-600 mt-1">{highestScore}</div>
                        </div>

                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <div className="text-xs font-semibold text-slate-400 uppercase">Nilai Terendah</div>
                            <div className="text-2xl font-extrabold text-rose-600 mt-1">{lowestScore}</div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden space-y-4 p-6">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Filter Kelas</label>
                                <select
                                    value={selectedClass}
                                    onChange={(e) => setSelectedClass(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 bg-white focus:ring-2 focus:ring-blue-600 outline-none"
                                >
                                    <option value="ALL">Semua Kelas (XII.1 - XII.10)</option>
                                    {CLASSES_LIST.map(c => (
                                        <option key={c} value={c}>Kelas {c}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Urutan (Sort)</label>
                                <select
                                    value={sortBy}
                                    onChange={(e) => setSortBy(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 bg-white focus:ring-2 focus:ring-blue-600 outline-none"
                                >
                                    <option value="NAME_ASC">Abjad Nama (A - Z)</option>
                                    <option value="NAME_DESC">Abjad Nama (Z - A)</option>
                                    <option value="SCORE_HIGH">Nilai Tertinggi</option>
                                    <option value="SCORE_LOW">Nilai Terendah</option>
                                    <option value="DATE_DESC">Paling Baru Selesai</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Cari Nama Siswa</label>
                                <input
                                    type="text"
                                    placeholder="Ketik nama..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none"
                                />
                            </div>
                        </div>

                        <div className="overflow-x-auto border border-slate-200 rounded-xl">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-100 text-slate-700 text-xs uppercase font-bold border-b border-slate-200">
                                    <tr>
                                        <th className="p-3.5 w-12 text-center">No</th>
                                        <th className="p-3.5">Nama Siswa</th>
                                        <th className="p-3.5 w-24 text-center">Kelas</th>
                                        <th className="p-3.5 w-28 text-center">Skor Akhir</th>
                                        <th className="p-3.5 w-32 text-center">Jawaban Benar</th>
                                        <th className="p-3.5 w-44 text-center">Waktu Pengerjaan</th>
                                        <th className="p-3.5 w-16 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {filteredRecords.length > 0 ? (
                                        filteredRecords.map((r, idx) => (
                                            <tr key={r.id} className="hover:bg-slate-50 transition">
                                                <td className="p-3.5 text-center text-xs text-slate-400 font-bold">{idx + 1}</td>
                                                <td className="p-3.5 font-bold text-slate-800">{r.name}</td>
                                                <td className="p-3.5 text-center">
                                                    <span className="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">
                                                        {r.studentClass}
                                                    </span>
                                                </td>
                                                <td className="p-3.5 text-center">
                                                    <span className={`text-base font-black ${r.score >= 75 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                        {r.score}
                                                    </span>
                                                </td>
                                                <td className="p-3.5 text-center font-semibold text-slate-600">
                                                    {r.correctCount || '-'} / {r.totalCount || 30}
                                                </td>
                                                <td className="p-3.5 text-center text-xs text-slate-500 font-medium">
                                                    {r.date}
                                                </td>
                                                <td className="p-3.5 text-center">
                                                    <button
                                                        onClick={() => handleDeleteRecord(r.id)}
                                                        className="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50 transition"
                                                        title="Hapus Data"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                        </svg>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))
                                    ) : (
                                        <tr>
                                            <td colSpan="7" className="p-8 text-center text-slate-400 text-xs font-medium">
                                                Tidak ada data nilai yang sesuai dengan filter.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>

                        {dbRecords.length > 0 && (
                            <div className="flex justify-end pt-2">
                                <button
                                    onClick={handleClearDb}
                                    className="text-xs text-rose-600 hover:text-rose-800 font-semibold underline"
                                >
                                    Kosongkan Database Nilai
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* STREAMING_CHUNK: Mounting React Root */
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
